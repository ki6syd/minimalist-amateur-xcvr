; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32s3-max-4b
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
monitor_raw = yes
debug_tool = esp-builtin
debug_init_break = break setup
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:pre_build.py

; Build flags in platformio.ini are related to configuration of the physical hardware
; #define's in globals.h are less frequently changed behavioral settings, feature flags, constants, etc
; entries in preferences.json are frequently-changed user-facing preferences

build_flags = 
	-I include
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCONFIG_SPIRAM_CACHE_WORKAROUND=1
	; -D CORE_DEBUG_LEVEL=5
	-D CORE_DEBUG_LEVEL=1
	-D WIFI_STA_SSID=\"${sysenv.HOME_WIFI_SSID}\"
	-D WIFI_STA_PASS=\"${sysenv.HOME_WIFI_PASSWORD}\"
	-D DEBUG_SERIAL_SPEED=460800
	-D VHF_SERIAL_SPEED=9600
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D PWM_CHANNEL_SYNC=0
	-D ADC_FS_COUNTS=4096
	-D ADC_MAX_VOLT=3.3
	-D ADC_VDD_SCALE=0.1304
	-D LED_RED=46
	-D LED_GRN=45
	-D ADC_VDD=1
	-D BUCK_SYNC=38
	-D BOOT_BTN=0
	-D CLOCK_SDA=11
	-D CLOCK_SCL=12

lib_deps = 
	etherkit/Etherkit Si5351 @ 2.1.4
	https://github.com/pschatzmann/arduino-audio-tools.git#v0.9.8
	https://github.com/pschatzmann/arduino-audio-driver.git#f9038d6de5039e948daa93656581634a682f4f92
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	https://github.com/PaulStoffregen/Time.git@^1.6.1
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/holgerlembke/ESPxWebFlMgr.git
	https://github.com/etherkit/JTEncode.git@^1.3.1